name: Release

# Builds the image ONCE, in CI, and pushes it to the registry. Servers pull this exact
# image. Building on the server cannot guarantee the artefact you tested is the artefact
# you shipped. See shockmegenie-docs/docs/adr/0006-registry-based-deploys.md
on:
  push:
    branches: [dev, prod]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/shockmegenie-admin

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Two tags: a moving branch tag the compose files reference, and an immutable
          # commit tag so a specific build can be pinned or rolled back to.
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
